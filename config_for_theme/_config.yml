## Disqus settings
##
# disqus_username: your-disqus-ID

# Analytics settings

## Google Analytics
# ga_track_id: UA-xxxxxx-xx

## Baidu Analytics
# ba_track_id: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

## Sitemap
sitemap:
  path: sitemap.xml

## Baidusitemap
baidusitemap:
  path: baidusitemap.xml
  baidu_push: true

# Custom Setting End

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
auto_spacing: true
titlecase: false
external_link: true
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: true
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: true
  tab_replace:

# Category & Tag
default_category: uncategorized
category_map:
tag_map:
home_posts_tag: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
per_page: 10
pagination_dir: archives

archive_generator:
  per_page: 10
  yearly: true
  monthly: true
  daily: false

# Markdown-it config
## Docs: https://github.com/celsomiranda/hexo-renderer-markdown-it/wiki
##
markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: true
    linkify: true
    typographer: true
    quotes: "“”‘’"

# Build Settings
anchorjs: true

# article top
top: true

# WordCount Settings
## Dependencies: https://github.com/willin/hexo-wordcount
wordcount: true

# top scroll progress
scroll: true

# Tip
tip:
  enable: true
  copyright: If you like this blog or find it useful for you, you are welcome to leave a note. Thank you !

# Social Share Post
socialshare: true

# Viewer config
viewer: true

# ThemeColor config
themecolor: true

# Search Setting
## Dependencies: https://github.com/V-Vincen/hexo-generator-zip-search
search:
  path: search.json
  zipPath: search.flv
  versionPath: searchVersion.json
  field: post
  trigger: auto
  top_n_per_article: 1

# Theme config
theme: livemylife

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  type: git
  repo: git@example.com:your_username/your_repo.git
  branch: master

# 鼠标特效
mouse_clicked:
  effect: emotions
