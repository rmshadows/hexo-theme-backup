# Hexo Configuration — EXAMPLE ONLY (placeholders, not a real site)
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Your Blog Title
subtitle: "Your subtitle"
author: Your Name
language: zh-CN
timezone: Asia/Shanghai

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://example.com
root: /
permalink: :year/:title/
permalink_defaults:

# CDN Setting
## Docs: https://www.jsdelivr.com/?docs=gh
#
# jsdelivr:
#   jsdelivr_url: https://cdn.jsdelivr.net/gh/
#   github_username: your_github_username

# Custom Setting Start

# Site settings
SEOTitle: YOUR SITE | slogan
email: you@example.com
description: "Your blog description..."
keyword: "blog,hexo,livemylife"
header-img: img/header_img/newhome_bg.jpg
archives-img: img/header_img/archive_bg2.jpg

# Favicon settings
favicon: img/avatar/roguerabbit.jpg

# Signature Setup
signature: true
signature-img: img/signature/your-signature.png

# Wave settings
wave: true

# SNS Settings
plugins: hexo-generator-feed
feed:
  type: atom
  path: atom.xml
  limit: 20
RSS: true
github_username: your_github_username
#twitter_username: yourAccount
instagram_username: yourAccount
# facebook_username: yourAccount
# linkedin_username: yourAccount
zhihu_username: yourAccount
# weibo_username: yourAccount

# Sidebar Settings
sidebar: true
sidebar-about-description: "Your short bio"
sidebar-avatar: img/avatar/head.png

# busuanzi: https://busuanzi.ibruce.info/
busuanzi: true

# 备案信息（可选；页脚展示，需本仓库主题 footer 支持）
# ICP：https://beian.miit.gov.cn/
icp:
  enable: false
  number: 省ICP备xxxxxxxx号-1
  link: https://beian.miit.gov.cn/

# 公安联网备案（可选）
gongan:
  enable: false
  number: # 省公网安备xxxxxxxxxxxx号
  code: # 备案号中的数字，用于拼接查询链接
  # link: https://beian.mps.gov.cn/#/query/webSearch?code=xxxxxxxxxxxx
  # icon: img/gongan-beian.png

# 彩带特效
ribbon: true

widgets:
  - visitor
  - featured-tags
  - short-about
  - recent-posts
  - friends-blog
  - archive
  - category

# widget behavior
## Archive
archive_type: "monthly"
show_count: true

## Featured Tags
featured-tags: true
featured-condition-size: 0

## Friends
friends:
  [
    { title: "Friend A", href: "https://example.com" },
    { title: "Friend B", href: "https://example.org" },
  ]

# Security 博文加密
# https://github.com/D0n9X1n/hexo-blog-encrypt
encrypt: # hexo-blog-encrypt
  abstract: Here's something encrypted, password is required to continue reading.
  message: Hey, password is required.
  tags:
    - { name: encryptAsDiary, password: your_tag_password_a }
    - { name: encryptAsTips, password: your_tag_password_b }
  theme: blink
  wrong_pass_message: Oh, this is an invalid password. Check and try again, please.
  wrong_hash_message: Oh, these decrypted content cannot be verified, but you can still have a look.

# Comment Settings (UI 文案为 COMMENTS)
# 单篇 front-matter 可覆盖：
#   artalk: false
#   artalk_collapse: true
#   artalk_unlock: "secret"
#   artalk_unlock_hint: "提示文字"
artalk:
  # 最后不要有斜杠
  url: "https://example.com/artalk"
  site: "Your Site Name"
  enable: true
  collapse: true
  unlock: ""
  unlock_hint: ""

