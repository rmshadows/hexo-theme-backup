# Custom Setting Start

# Site settings
SEOTitle: RYAN | be yourself
email: justaaaa@163.com
description: "This is CIVICCCCC's blog..."
keyword: "rmshadows,civiccccc,blog,Blog"
header-img: img/header_img/newhome_bg.jpg
archives-img: img/header_img/archive_bg2.jpg

# Favicon settings
favicon: img/avatar/roguerabbit.jpg

# Signature Setup
signature: true # show signature
signature-img: img/signature/rmshadows.png

# Wave settings
wave: true

# SNS Settings
# Extensions
plugins: hexo-generator-feed
#Feed Atom RSS设置
feed:
  type: atom
  path: atom.xml
  limit: 20
RSS: true
github_username: rmshadows
#twitter_username: V_Vincen_
instagram_username: just_aaaa_r
# facebook_username:  yourAccount
# linkedin_username:  yourAccount
zhihu_username: rmshadows
# weibo_username: WVincen

# Sidebar Settings
sidebar: true # whether or not using Sidebar.
sidebar-about-description: "海纳百川 有容乃大"
sidebar-avatar: img/avatar/head.png #roguerabbit.jpg    # use absolute URL, seeing it's used in both `/` and `/about/`

# busuanzi: https://busuanzi.ibruce.info/
busuanzi: true

# 备案信息（可选；页脚展示，需本仓库主题 footer 支持）
# ICP：https://beian.miit.gov.cn/
icp:
  enable: false
  number: 省ICP备xxxxxxxx号-1
  link: https://beian.miit.gov.cn/

# 公安联网备案（可选）
gongan:
  enable: false
  number: # 省公网安备xxxxxxxxxxxx号
  code: # 备案号中的数字，用于拼接查询链接
  # link: https://beian.mps.gov.cn/#/query/webSearch?code=xxxxxxxxxxxx
  # icon: img/gongan-beian.png

# 彩带特效
ribbon: true

widgets:
  - visitor
  - featured-tags
  - short-about
  - recent-posts
  - friends-blog
  - archive
  - category

# widget behavior
## Archive
archive_type: "monthly"
show_count: true

## Featured Tags
featured-tags: true # whether or not using Feature-Tags
featured-condition-size: 0 # A tag will be featured if the size of it is more than this condition value

## Friends
friends:
  [
    { title: "主站", href: "https://civiccccc.ltd" },
    { title: "国庆电播小弟", href: "https://github.com/xjx0106" },
    { title: "itcast-ying", href: "https://github.com/itcast-ying" },
    { title: "Xeon-J", href: "https://github.com/cjj19970505" },
    { title: "Xeon-H", href: "https://github.com/XeonKHJ" },
    { title: "Gitee - Ryan Yim", href: "https://gitee.com/rmshadows" },
    { title: "404 No Found Page", href: "https://rmshadows.gitee.io/404" },
  ]

# Security 博文加密
# https://github.com/D0n9X1n/hexo-blog-encrypt
encrypt: # hexo-blog-encrypt
  abstract: Here's something encrypted, password is required to continue reading.
  message: Hey, password is required.
  tags:
    - { name: encryptAsDiary, password: passwordA }
    - { name: encryptAsTips, password: passwordB }
  theme: blink
  wrong_pass_message: Oh, this is an invalid password. Check and try again, please.
  wrong_hash_message: Oh, these decrypted content cannot be verified, but you can still have a look.

# Comment Settings (UI 文案为 COMMENTS)
# 单篇 front-matter 可覆盖：
#   artalk: false
